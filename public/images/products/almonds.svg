<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#EFE6DC"/>
    </radialGradient>
    <radialGradient id="almondSkin" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#D99B6C"/>
      <stop offset="60%" stop-color="#9C592C"/>
      <stop offset="100%" stop-color="#5C2D12"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#452410" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="200" cy="210" rx="140" ry="45" fill="#381D0E" opacity="0.12"/>
  <ellipse cx="200" cy="195" rx="135" ry="40" fill="#E8DEC8" stroke="#C9B69B" stroke-width="3"/>
  <ellipse cx="200" cy="190" rx="125" ry="32" fill="#D8C8AF"/>

  <!-- Almond 1 (Center) -->
  <path d="M200 120 C235 150 225 185 200 200 C175 185 165 150 200 120 Z" fill="url(#almondSkin)" filter="url(#shadow)"/>
  <!-- Almond 2 (Tilted Right) -->
  <path d="M235 135 C270 160 265 190 240 205 C215 195 210 165 235 135 Z" fill="url(#almondSkin)" filter="url(#shadow)" transform="rotate(25, 235, 170)"/>
  <!-- Almond 3 (Tilted Left) -->
  <path d="M165 135 C190 165 185 195 160 205 C135 190 130 160 165 135 Z" fill="url(#almondSkin)" filter="url(#shadow)" transform="rotate(-25, 165, 170)"/>

  <rect x="20" y="20" width="80" height="24" rx="6" fill="#542E1D"/>
  <text x="60" y="36" fill="#FDE68A" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">لوز محمص</text>
</svg>
