<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          var descriptor = {
            configurable: true,
            enumerable: true,
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            }
          };

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (e) {}
          }
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e) {}
          if (typeof globalThis !== 'undefined') {
            try {
              Object.defineProperty(globalThis, 'fetch', descriptor);
            } catch (e) {}
          }
        } catch (err) {}

        // Suppress any uncaught extension errors regarding fetch
        window.addEventListener(
          'error',
          function(e) {
            if (
              e &&
              e.message &&
              e.message.indexOf('fetch') !== -1 &&
              (e.filename && e.filename.indexOf('chrome-extension://') !== -1)
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return false;
            }
          },
          true
        );
      })();
    </script>
