<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#EFE6DC"/>
    </radialGradient>
    <radialGradient id="shell" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F5E8D3"/>
      <stop offset="70%" stop-color="#D4BF9E"/>
      <stop offset="100%" stop-color="#9C815B"/>
    </radialGradient>
    <radialGradient id="kernel" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C5E887"/>
      <stop offset="60%" stop-color="#6F9C2C"/>
      <stop offset="100%" stop-color="#733845"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#452410" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="200" cy="210" rx="140" ry="45" fill="#381D0E" opacity="0.12"/>
  <ellipse cx="200" cy="195" rx="135" ry="40" fill="#E8DEC8" stroke="#C9B69B" stroke-width="3"/>
  <ellipse cx="200" cy="190" rx="125" ry="32" fill="#D8C8AF"/>

  <!-- Pistachio 1 (Center Open) -->
  <g transform="translate(160, 120)" filter="url(#shadow)">
    <!-- Exposed green kernel -->
    <ellipse cx="40" cy="35" rx="26" ry="18" fill="url(#kernel)" transform="rotate(-15, 40, 35)"/>
    <!-- Left shell half -->
    <path d="M15 15 C30 5 60 15 65 38 C55 42 25 35 15 15 Z" fill="url(#shell)"/>
    <!-- Right shell half -->
    <path d="M20 52 C45 60 70 45 68 25 C58 35 30 48 20 52 Z" fill="url(#shell)"/>
  </g>

  <!-- Pistachio 2 -->
  <g transform="translate(210, 135)" filter="url(#shadow)">
    <ellipse cx="35" cy="30" rx="24" ry="16" fill="url(#kernel)" transform="rotate(25, 35, 30)"/>
    <path d="M12 12 C28 4 55 12 60 32 C50 36 22 30 12 12 Z" fill="url(#shell)"/>
    <path d="M18 48 C40 54 62 40 60 22 C52 30 26 42 18 48 Z" fill="url(#shell)"/>
  </g>

  <!-- Pistachio 3 -->
  <g transform="translate(125, 150)" filter="url(#shadow)">
    <ellipse cx="30" cy="25" rx="22" ry="15" fill="url(#kernel)" transform="rotate(-35, 30, 25)"/>
    <path d="M10 10 C24 3 48 10 52 28 C42 32 18 26 10 10 Z" fill="url(#shell)"/>
    <path d="M15 42 C35 48 54 36 52 20 C45 27 22 37 15 42 Z" fill="url(#shell)"/>
  </g>

  <rect x="20" y="20" width="80" height="24" rx="6" fill="#542E1D"/>
  <text x="60" y="36" fill="#FDE68A" font-family="'Cairo', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">فستق حلبي</text>
</svg>
